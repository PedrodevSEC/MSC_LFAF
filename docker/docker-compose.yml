services:

  postgres:
    image: postgres:16

    container_name: lfaf_postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7

    container_name: lfaf_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:

  postgres_data: